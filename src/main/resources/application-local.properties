# DB User for the Application with elevated privileges
# CHECK THE mysql-setup-pierrot.sql script under THE SCRIPTS FOLDER
spring.datasource.username=orderuser
spring.datasource.password=orderuser
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/jt_orderservice_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC

spring.jpa.hibernate.ddl-auto=validate

# USER FOR MIGRATIONS E.G. FLYWAY USER
spring.flyway.user=orderadmin
spring.flyway.password=orderadmin

# POSSIBLE BUT NOT NECESSARY IN OUR CONTEXT
